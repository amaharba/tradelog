# Будит базу Supabase каждые 3 дня, чтобы бесплатный проект не уснул.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # каждые 3 дня в 06:00 UTC
  workflow_dispatch:         # кнопка ручного запуска во вкладке Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к базе
        run: |
          curl -sf "https://ifrtyfypzpfuwzzistfg.supabase.co/rest/v1/tradelog?select=key&limit=1" \
            -H "apikey: sb_publishable_Ms3YLkiCuHi6naSl39_RoQ_S1rpvNza" \
            -H "Authorization: Bearer sb_publishable_Ms3YLkiCuHi6naSl39_RoQ_S1rpvNza"
